name: Build and Release Prime Cipher Executables

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies & Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install nuitka

      - name: Install C Compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf build-essential

      - name: Build Standalone Executable with Nuitka (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m nuitka --standalone --onefile --output-filename=prime-cipher-linux prime_cipher.py

      - name: Build Standalone Executable with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m nuitka --standalone --onefile --assume-yes-for-downloads --output-filename=prime-cipher-windows.exe prime_cipher.py

      - name: Upload Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux
          path: prime-cipher-linux

      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: binary-windows
          path: prime-cipher-windows.exe

  release:
    name: Publish Public Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Prime Cipher Release #${{ github.run_number }}"
          body: "Latest automated standalone binaries generated with Nuitka."
          draft: false
          prerelease: false
          files: |
            release-files/binary-linux/prime-cipher-linux
            release-files/binary-windows/prime-cipher-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
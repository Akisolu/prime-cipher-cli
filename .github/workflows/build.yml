name: Build Prime Cipher Executables (Nuitka)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies & Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install nuitka

      - name: Install C Compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf build-essential

      - name: Build Standalone Executable with Nuitka (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m nuitka --standalone --onefile --output-filename=prime-cipher prime_cipher.py

      - name: Build Standalone Executable with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m nuitka --standalone --onefile --assume-yes-for-downloads --output-filename=prime-cipher.exe prime_cipher.py

      - name: Upload Executable Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: prime-cipher-linux
          path: prime-cipher

      - name: Upload Executable Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: prime-cipher-windows
          path: prime-cipher.exe